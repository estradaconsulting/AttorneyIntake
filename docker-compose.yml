services:
  api:
    build:
      context: ./backend
      dockerfile: src/Hogan4Eviction.API/Dockerfile
    container_name: hogan_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Database:Provider=InMemory — no SQL Server needed until launch
      Database__Provider: "InMemory"
      Storage__Provider: "Local"
      Storage__LocalPath: "/app/uploads"
      # Dev auth + Swagger on by default in this compose file
      Security__SwaggerEnabled: "true"
      Security__DevAuthEnabled: "true"
      # Azure hooks — uncomment and fill in .env when switching to Azure
      # AzureAd__TenantId: "${AZURE_AD_TENANT_ID}"
      # AzureAd__ClientId: "${AZURE_AD_CLIENT_ID}"
      # AzureAd__Audience: "${AZURE_AD_AUDIENCE}"
      # Azure__BlobStorage__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING}"
      # Azure__BlobStorage__ContainerName: "${AZURE_BLOB_CONTAINER_NAME}"
    ports:
      - "5000:8080"
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hogan_web
    environment:
      VITE_API_URL: "http://localhost:5000"
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  uploads:

