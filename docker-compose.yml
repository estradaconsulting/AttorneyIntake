services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04
    container_name: hogan_db
    environment:
      ACCEPT_EULA: "Y"
      # H-02: No default password fallback — deployment FAILS loudly if not set.
      # Generate a strong password and set it in .env (never commit .env to git).
      SA_PASSWORD: "${DB_SA_PASSWORD:?DB_SA_PASSWORD must be set in .env — see .env.example}"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -C
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: src/Hogan4Eviction.API/Dockerfile
    container_name: hogan_api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # H-07: Use a least-privilege app account, NOT sa.
      # Create this account in SQL Server before production deployment (see README).
      ConnectionStrings__DefaultConnection: >-
        Server=db,1433;
        Database=Hogan4EvictionDb;
        User=${DB_APP_USER:?DB_APP_USER must be set};
        Password=${DB_APP_PASSWORD:?DB_APP_PASSWORD must be set};
        TrustServerCertificate=${DB_TRUST_CERT:-False}
      Storage__Provider: "Local"
      Storage__LocalPath: "/app/uploads"
      # Security flags — dev defaults are permissive; production overrides in .env
      Security__SwaggerEnabled: "${SWAGGER_ENABLED:-false}"
      Security__DevAuthEnabled: "${DEV_AUTH_ENABLED:-false}"
      # Azure hooks — fill these in via .env when switching to Azure
      # AzureAd__TenantId: "${AZURE_AD_TENANT_ID}"
      # AzureAd__ClientId: "${AZURE_AD_CLIENT_ID}"
      # AzureAd__Audience: "${AZURE_AD_AUDIENCE}"
      # Azure__BlobStorage__ConnectionString: "${AZURE_BLOB_CONNECTION_STRING}"
      # Azure__BlobStorage__ContainerName: "${AZURE_BLOB_CONTAINER_NAME}"
      # Azure__KeyVault__Uri: "${AZURE_KEY_VAULT_URI}"
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hogan_web
    environment:
      VITE_API_URL: "http://localhost:5000"
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  sqldata:
  uploads:
