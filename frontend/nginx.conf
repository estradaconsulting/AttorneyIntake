server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── M-02: HTTP security headers ───────────────────────────────────────────
    # Prevents browsers from MIME-sniffing a response away from the declared type
    add_header X-Content-Type-Options    "nosniff"                              always;

    # Stops the app being embedded in iframes (clickjacking protection)
    add_header X-Frame-Options           "DENY"                                 always;

    # Controls how much referrer info is included with requests
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # Disables browser features not needed by this app
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy — tightened for a React SPA with no inline scripts.
    # Adjust script-src if you add a CDN; adjust connect-src to match your API host.
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src  'self'; \
         style-src   'self' 'unsafe-inline'; \
         img-src     'self' data: blob:; \
         font-src    'self'; \
         connect-src 'self' http://api:8080; \
         frame-ancestors 'none'; \
         base-uri    'self'; \
         form-action 'self';"              always;

    # Enforce HTTPS once deployed behind TLS (max-age=1 year)
    # Uncomment when TLS termination is in place:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── React Router: serve index.html for all routes ─────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend "http://api:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host       $host;
        proxy_cache_bypass          $http_upgrade;
        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;

        # Don't forward the security headers twice (backend sets its own)
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
    }

    # ── Static asset caching ──────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-apply security headers on static responses (nginx only keeps last add_header block)
        add_header X-Content-Type-Options "nosniff"                         always;
        add_header X-Frame-Options        "DENY"                             always;
    }
}
